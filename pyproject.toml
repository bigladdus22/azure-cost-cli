[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-cost-cli"
version = "0.1.0"
description = "Estimate the Azure cost of applications catalogued in a Supabase database."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["requests>=2.31"]

[project.scripts]
azure-cost = "azure_cost_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
